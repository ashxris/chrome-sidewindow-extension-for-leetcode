<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>YouTube DSA Sidebar</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="dot" id="statusDot"></span>
    <h1>YouTube Sidebar</h1>
  </header>

  <button id="toggleBtn" class="primary">Open sidebar</button>

  <section class="field">
    <span class="label">Width</span>
    <div class="segmented">
      <button class="seg-btn" data-fraction="3">1/3 screen</button>
      <button class="seg-btn" data-fraction="4">1/4 screen</button>
    </div>
  </section>

  <label class="checkbox-row">
    <input type="checkbox" id="autoOpen" />
    <span>Auto-open when I open a LeetCode problem</span>
  </label>

  <p class="hint">
    Tip: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Y</kbd> toggles the sidebar
    from anywhere (editable in chrome://extensions/shortcuts).
  </p>

  <script src="popup.js"></script>
</body>
</html>
